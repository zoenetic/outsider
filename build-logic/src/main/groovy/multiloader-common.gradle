plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm'
    id 'dev.detekt'
}

def modProject = project.parent
['mod_id', 'mod_name', 'mod_description', 'mod_namespace'].each { key ->
    if (modProject == null || !modProject.hasProperty(key)) {
        throw new GradleException(
                "${project.path} applies multiloader-common but its parent project " +
                        "does not define '${key}'. Add it to the mod's gradle.properties.")
    }
    ext[key] = modProject.property(key)
}

description = mod_description

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

kotlin {
    compilerOptions {
        progressiveMode = true
        allWarningsAsErrors = true
        jvmDefault = org.jetbrains.kotlin.gradle.dsl.JvmDefaultMode.NO_COMPATIBILITY
        // Mojang's @Deprecated mostly means "internal: override, don't call", which modding code can't
        // avoid, so deprecations stay visible as warnings without failing the build.
        freeCompilerArgs.addAll('-Xreturn-value-checker=full', '-Xwarning-level=DEPRECATION:warning')
    }
    explicitApi()
}

detekt {
    buildUponDefaultConfig = true
    parallel = true
    config.setFrom(rootProject.file('config/detekt/detekt.yml'))
    baseline = file('detekt-baseline.xml')
}

dependencies {
    detektPlugins 'dev.detekt:detekt-rules-ktlint-wrapper:2.0.0-alpha.6'
}

// `check` only runs the plain `detekt` task, which has no type resolution, so several rules can't run.
// Run the per-source-set type-resolution tasks instead, and turn the plain one off so findings
// aren't reported twice.
tasks.named('detekt') { enabled = false }
tasks.named('check') {
    dependsOn tasks.matching { it.name ==~ /detekt(Main|Test|Gametest|Datagen)/ }
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    var expandProps = [
            'version'                      : version,
            'group'                        : project.group,
            'minecraft_version'            : minecraft_version,
            'minecraft_version_range'      : minecraft_version_range,
            'fabric_version'               : fabric_version,
            'fabric_loader_version'        : fabric_loader_version,
            'flk_version'                  : flk_version,
            'neoforge_version'             : neoforge_version,
            'neoforge_loader_version_range': neoforge_loader_version_range,
            'klf_version'                  : klf_version,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'mod_namespace'                : mod_namespace,
            'license'                      : license,
            'credits'                      : credits,
            'description'                  : mod_description,
            'java_version'                 : java_version
    ]

    var jsonExpandProps = expandProps.collectEntries { key, value ->
        [(key): value instanceof String ? value.replace('\n', '\\\\n') : value]
    }

    filesMatching(['META-INF/neoforge.mods.toml']) { expand expandProps }
    filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) { expand jsonExpandProps }

    inputs.properties(expandProps)
}

// The gametest and datagen source sets are not wired into `build` by the loader plugins, so a
// signature change in main can leave them broken without anything failing. Compile them as part
// of `check`. Deferred because the source sets are declared in each module's own build script,
// after this plugin is applied.
afterEvaluate {
    ['gametestClasses', 'datagenClasses'].each { name ->
        if (tasks.findByName(name) != null) {
            tasks.named('check') { dependsOn name }
        }
    }
}
