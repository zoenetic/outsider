plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
    id "org.jetbrains.kotlin.kapt"
}

sourceSets {
    main {
        resources.srcDir('src/generated/resources')
    }
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
    datagen {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

neoForge {
    neoFormVersion = neo_form_version
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    addModdingDependenciesTo(sourceSets.test)
    addModdingDependenciesTo(sourceSets.gametest)
    addModdingDependenciesTo(sourceSets.datagen)
}

dependencies {
    compileOnly('net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7')
    compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.5.3'))
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
    testImplementation 'org.mockito:mockito-core:5.20.0'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging { exceptionFormat = 'full' }
}

configurations {
    commonJava { canBeResolved = false; canBeConsumed = true }
    commonKotlin { canBeResolved = false; canBeConsumed = true }
    commonResources { canBeResolved = false; canBeConsumed = true }
    commonGametest { canBeResolved = false; canBeConsumed = true }
    commonGametestClasses { canBeResolved = false; canBeConsumed = true }
    commonDatagen { canBeResolved = false; canBeConsumed = true }
}

tasks.register('gametestJar', Jar) {
    archiveClassifier = 'gametest'
    from sourceSets.gametest.output
}

artifacts {
    commonJava file('src/main/java')
    commonKotlin file('src/main/kotlin')
    commonResources file('src/main/resources')
    commonResources file('src/generated/resources')
    commonDatagen file('src/datagen/kotlin')
    commonGametest file('src/gametest/kotlin')
    commonGametestClasses tasks.named('gametestJar')
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
    configurations.named(variant) {
        attributes { attribute(loaderAttribute, 'common') }
    }
}

sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named(variant) {
            attributes { attribute(loaderAttribute, 'common') }
        }
    }
}

repositories {
    mavenCentral()
}
