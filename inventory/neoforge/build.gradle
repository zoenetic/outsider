plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

repositories {
    maven {
        name = 'nyon'
        url = uri('https://repo.nyon.dev/releases')
        content { includeGroup('dev.nyon') }
    }
}

dependencies {
    implementation("dev.nyon:KotlinLangForge:${klf_version}")
}

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
    datagen {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

configurations {
    commonGametest { canBeResolved = true }
    commonGametestClasses { canBeResolved = true }
    commonDatagen { canBeResolved = true }
}

dependencies {
    commonGametest(project(path: common_project.path, configuration: 'commonGametest'))
    commonGametestClasses(project(path: common_project.path, configuration: 'commonGametestClasses'))
    commonDatagen(project(path: common_project.path, configuration: 'commonDatagen'))
}

sourceSets.gametest.compileClasspath += configurations.commonGametestClasses

tasks.named('compileGametestKotlin') {
    dependsOn(configurations.commonGametest)
    source(configurations.commonGametest.asFileTree.matching { include '**/*.kt' })
}

tasks.named('compileDatagenKotlin') {
    dependsOn(configurations.commonDatagen)
    source(configurations.commonDatagen.asFileTree.matching { include '**/*.kt' })
}

neoForge {
    version = neoforge_version

    def at = common_project.file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }

    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_namespace)
            ideName = "NeoForge ${it.name.capitalize()}"
        }
        client {
            client()
            gameDirectory = this.mkdir(this.file('runs/client'))
        }
        server {
            server()
            gameDirectory = this.mkdir(this.file('runs/server'))
        }
        gametest {
            type = 'gameTestServer'
            gameDirectory = this.mkdir(this.file('runs/gametest'))
        }
        data {
            clientData()
            gameDirectory = this.mkdir(this.file('runs/data'))
            // Generated data is loader-agnostic, so it lands in common and both
            // loaders ship it through the commonResources configuration.
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', common_project.file('src/generated/resources/').absolutePath,
                    '--existing', common_project.file('src/main/resources/').absolutePath
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.gametest
            sourceSet sourceSets.datagen
        }
    }
}

// `runClientWithDatagen` regenerates data, then launches the client. Kept as a
// separate task from `runClient` because the data run is a full headless client
// start and the output is committed, so most launches have nothing to regenerate.
// Gradle copies mod resources before any run task and never runs a task twice in
// one build, so the fresh output is copied into the run's resources by a second
// task after datagen finishes and before the client starts.
def syncGeneratedResources = tasks.register('syncGeneratedResources', Copy) {
    from(common_project.file('src/generated/resources'))
    into(layout.buildDirectory.dir('resources/main'))
    exclude('.cache/**')
}
afterEvaluate {
    def datagen = tasks.named('runData')
    def runClient = tasks.named('runClient')
    syncGeneratedResources.configure { mustRunAfter(datagen) }
    runClient.configure { mustRunAfter(syncGeneratedResources) }
    tasks.register('runClientWithDatagen') {
        group = runClient.get().group
        description = 'Regenerates data, syncs it into the run resources, then launches the client.'
        dependsOn(datagen, syncGeneratedResources, runClient)
    }
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
    configurations.named(variant) {
        attributes { attribute(loaderAttribute, 'neoforge') }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named(variant) {
            attributes { attribute(loaderAttribute, 'neoforge') }
        }
    }
}
